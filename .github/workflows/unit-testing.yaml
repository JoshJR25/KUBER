name: CI - Unit Test

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore '.Net/Exploring Actions/Exploring Actions.sln'

      - name: Build the solution
        run: dotnet build '.Net/Exploring Actions/Exploring Actions.sln' --configuration Release --no-restore

      - name: Run unit tests with report
        run: dotnet test '.Net/Exploring Actions/WeatherForecastControllerTestt/WeatherForecastControllerTestt.csproj' --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"
        
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: '.Net/Exploring Actions/WeatherForecastControllerTestt/WeatherForecastControllerTestt.csproj'
